# Reusable collection workflow.
#
# Split out from `collect.yml` so the Issue path can invoke exactly the same logic as the
# scheduled path. If these two ever diverged, a user-submitted site would behave differently
# from a cron-harvested one -- which is the kind of bug that only shows up in production.

name: _collect

on:
  workflow_call:
    inputs:
      sites:
        description: Comma-separated site keys. Empty means "every enabled site".
        type: string
        default: ""
      tiers:
        description: Comma-separated tier filter, e.g. "1,2".
        type: string
        default: ""
      mode:
        description: probe | full | incremental
        type: string
        default: "full"
      limits:
        description: Extra CLI flags, e.g. "--max-titles 200".
        type: string
        default: ""
      verify:
        description: Run the pre-commit self-check.
        type: boolean
        default: true
      commit:
        description: Commit and push the artefacts. Disable for dry runs.
        type: boolean
        default: true
      issue_number:
        description: Originating Issue number, for the comment posted at the end.
        type: string
        default: ""
    outputs:
      summary:
        description: Human-readable run summary.
        value: ${{ jobs.report.outputs.summary }}
      sites_ok:
        description: Number of sites harvested successfully.
        value: ${{ jobs.report.outputs.sites_ok }}
    secrets:
      SITE_TOKENS:
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  # Serialise runs on the same branch: two concurrent runs would race on `git push` and one
  # would lose its artefacts.
  group: collect-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  HARVEST_GATEWAY: ${{ vars.HARVEST_GATEWAY }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the tip of the triggering branch, not the SHA the event fired on.
          #
          # `actions/checkout` defaults to `github.sha`, which for an `issues` event is the
          # default branch as it stood *when the event fired*. The intake job then commits the
          # new recipe, so the jobs downstream were reading a tree without it: `harvest` ran
          # `plan --sites <new key>`, found nothing, produced an empty matrix, and skipped
          # collection entirely. The submitter was told "自动采集未成功" for a site the pipeline
          # never attempted.
          #
          # It also made a second run on the same issue re-create a recipe that already existed
          # upstream and then fail on `git pull --rebase`.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        # `pip install -e .` is not optional. The offline test suite passes without it, because
        # tests/conftest.py puts src/ on sys.path -- but every `python -m harvest.cli ...` step
        # then dies with ModuleNotFoundError: No module named 'harvest'. Installing the package
        # also validates pyproject.toml packaging on every run, which is worth knowing about.
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Build matrix
        id: build
        env:
          INPUT_SITES: ${{ inputs.sites }}
          INPUT_TIERS: ${{ inputs.tiers }}
        run: |
          set -euo pipefail
          mkdir -p .ci
          python -m harvest.cli plan --sites "$INPUT_SITES" --tiers "$INPUT_TIERS" --output .ci/matrix.txt
          cat .ci/matrix.txt >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          raw = pathlib.Path('.ci/matrix.txt').read_text().split('matrix=', 1)[-1].strip()
          data = json.loads(raw)
          print(f"count={len(data.get('include', []))}")
          PY
          echo "--- matrix ---"
          cat .ci/matrix.txt

  collect:
    needs: plan
    # An empty matrix makes `strategy.matrix` evaluate to nothing, which GitHub rejects.
    # Skipping the job explicitly is cleaner than emitting a dummy site.
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4          # caps total pressure on upstream sites
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the tip of the triggering branch, not the SHA the event fired on.
          #
          # `actions/checkout` defaults to `github.sha`, which for an `issues` event is the
          # default branch as it stood *when the event fired*. The intake job then commits the
          # new recipe, so the jobs downstream were reading a tree without it: `harvest` ran
          # `plan --sites <new key>`, found nothing, produced an empty matrix, and skipped
          # collection entirely. The submitter was told "自动采集未成功" for a site the pipeline
          # never attempted.
          #
          # It also made a second run on the same issue re-create a recipe that already existed
          # upstream and then fail on `git pull --rebase`.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache Playwright browsers
        if: matrix.needs_browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        # `pip install -e .` is not optional. The offline test suite passes without it, because
        # tests/conftest.py puts src/ on sys.path -- but every `python -m harvest.cli ...` step
        # then dies with ModuleNotFoundError: No module named 'harvest'. Installing the package
        # also validates pyproject.toml packaging on every run, which is worth knowing about.
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Install Chromium (Tier 4 only)
        if: matrix.needs_browser
        run: python -m playwright install --with-deps chromium

      - name: Harvest ${{ matrix.site }}
        env:
          SITE_TOKENS: ${{ secrets.SITE_TOKENS }}
          # One matrix job per site, all writing today's report. Without the tag every job would
          # write data/reports/<date>.json and all but one would be lost when the artifacts are
          # merged -- which left both the run summary and the Issue comment with nothing to say.
          HARVEST_REPORT_TAG: ${{ matrix.site }}
        run: |
          set -euo pipefail
          # `--no-verify`, not `--verify false`: --verify is a flag pair (--verify/--no-verify),
          # so a trailing `false` is parsed as a stray positional argument and the command dies
          # with "Got unexpected extra argument(s) (false)". Verification belongs to the report
          # job anyway, which runs it once over the merged result.
          python -m harvest.cli collect \
            --site "${{ matrix.site }}" \
            --mode "${{ inputs.mode }}" \
            --no-verify \
            ${{ inputs.limits }}

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvest-${{ matrix.site }}
          path: |
            data/raw/${{ matrix.site }}
            data/normalized/${{ matrix.site }}.json
            data/snapshot/${{ matrix.site }}
            data/tvbox/sites/${{ matrix.site }}.json
            data/reports/*.${{ matrix.site }}.json
            data/reports/*.${{ matrix.site }}.md
            sites/${{ matrix.site }}.yaml
          if-no-files-found: warn
          retention-days: 14

  report:
    needs: collect
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.summarise.outputs.summary }}
      sites_ok: ${{ steps.summarise.outputs.sites_ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the tip of the triggering branch, not the SHA the event fired on.
          #
          # `actions/checkout` defaults to `github.sha`, which for an `issues` event is the
          # default branch as it stood *when the event fired*. The intake job then commits the
          # new recipe, so the jobs downstream were reading a tree without it: `harvest` ran
          # `plan --sites <new key>`, found nothing, produced an empty matrix, and skipped
          # collection entirely. The submitter was told "自动采集未成功" for a site the pipeline
          # never attempted.
          #
          # It also made a second run on the same issue re-create a recipe that already existed
          # upstream and then fail on `git pull --rebase`.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        # `pip install -e .` is not optional. The offline test suite passes without it, because
        # tests/conftest.py puts src/ on sys.path -- but every `python -m harvest.cli ...` step
        # then dies with ModuleNotFoundError: No module named 'harvest'. Installing the package
        # also validates pyproject.toml packaging on every run, which is worth knowing about.
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Download per-site artefacts
        uses: actions/download-artifact@v4
        with:
          pattern: harvest-*
          merge-multiple: true

      - name: Regenerate configs
        env:
          GATEWAY: ${{ vars.HARVEST_GATEWAY }}
        run: |
          set -euo pipefail
          python -m harvest.cli generate --all --flavors direct,gateway,experimental \
            --gateway "$GATEWAY" --run-id "${{ github.run_id }}"

      - name: Verify generated config
        # Advisory on purpose. A failed verify is a network observation, not a verdict on the
        # source, so it must not remove an entry: one upstream hiccup would strip a working
        # source from every subscriber until the next full run. The failure is surfaced in the
        # run summary and the report artefact instead, which is where a human can act on it.
        if: inputs.verify
        run: |
          set -euo pipefail
          python -m harvest.cli verify --targets data/tvbox/index.json || \
            echo "::warning::verification reported failures; see the report artefact"

      - name: Prune raw archive
        run: python -m harvest.cli prune --keep 7

      - name: Summarise
        id: summarise
        run: |
          set -euo pipefail
          # Capture stdout into a shell variable and let the shell expand it. A step cannot read
          # its own step outputs: GitHub expands expression syntax in `run` as the step starts,
          # before that step has written anything, so the notice was always blank.
          #
          # Do not write literal expression braces in these comments. GitHub evaluates them even
          # inside shell comments, and an empty pair is a hard syntax error that makes the whole
          # workflow file fail to load.
          line=$(python -m harvest.cli summary --github-output "$GITHUB_OUTPUT")
          echo "::notice::$line"

      - name: Refresh the site ledger
        # The collect job updates an in-memory Registry and uploads only `data/reports/`, so its
        # update was discarded with the workspace: `last_run` never got a value (the Issue form's
        # duplicate reply therefore always said "上次采集时间：未知"), and adapter/tier stayed at
        # whatever the intake wrote. Doing it here, from the merged reports, means one writer and
        # a result that actually reaches the commit below.
        run: python -m harvest.cli update-ledger

      - name: Commit and push
        if: inputs.commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `config` is here for one file: config/blacklist/bc_domains.learned.txt, which the
          # `summary` step writes when a gambling host has been hit repeatedly. Without it in the
          # commit, automatic BC host learning ran on every harvest and persisted nothing -- the
          # blacklist could only ever change by hand, which is the opposite of what it is for.
          git add data sites config
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "chore(data): harvest ${{ github.run_id }} [skip ci]"
          git pull --rebase --autostash
          git push

      - name: Purge jsDelivr cache
        # Not optional: branch caching is 12h by default, so without this a user keeps
        # seeing yesterday's subscription long after a successful run.
        if: inputs.commit
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m harvest.cli purge-cdn --paths data/tvbox,data/snapshot --ref main

      - name: Comment on originating issue
        if: inputs.issue_number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPO: ${{ github.repository }}
          SUBSCRIBE_URL: https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/data/tvbox/index.json
        run: |
          set -euo pipefail
          mkdir -p .ci
          python -m harvest.cli summary \
            --comment .ci/comment.md \
            --subscribe-url "$SUBSCRIBE_URL"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file .ci/comment.md
