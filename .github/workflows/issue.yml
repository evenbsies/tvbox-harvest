# Turns a submitted site request into a recipe, then harvests it.
#
# SECURITY: the Issue body is untrusted. It is always passed to Python through an environment
# variable and parsed there -- never interpolated into a shell command line. The only value
# that ever reaches a network call is a URL that passed `validate_public_url`, which rejects
# private/loopback/link-local hosts (SSRF hardening).

name: issue-intake

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: issue-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  intake:
    # Only the site-request form is handled here; removal requests are handled by a human.
    #
    # The label is the primary signal, but it is *repository state*: labels are not files, so a
    # fork does not necessarily carry them, and a missing `site-request` label silently disables
    # the project's headline feature -- the workflow just never fires. This repository had none
    # of the four labels it depends on, so the fallback below is not hypothetical.
    #
    # The fallback keys off the form's own field heading, which *is* a file the fork has. A body
    # containing `### 站点地址` came from add-site.yml; a removal request has its own template.
    if: >-
      contains(github.event.issue.labels.*.name, 'site-request') ||
      contains(github.event.issue.body, '### 站点地址')
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.parse.outputs.ok }}
      key: ${{ steps.parse.outputs.key }}
      duplicate: ${{ steps.parse.outputs.duplicate }}
      message: ${{ steps.parse.outputs.message }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        # `pip install -e .` is not optional. The offline test suite passes without it, because
        # tests/conftest.py puts src/ on sys.path -- but every `python -m harvest.cli ...` step
        # then dies with ModuleNotFoundError: No module named 'harvest'. Installing the package
        # also validates pyproject.toml packaging on every run, which is worth knowing about.
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Parse issue into a recipe
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          python -m harvest.cli issue-parse --github-output "$GITHUB_OUTPUT"

      - name: Acknowledge or reject
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MESSAGE: ${{ steps.parse.outputs.message }}
        run: |
          set -euo pipefail
          if [ -z "$MESSAGE" ]; then MESSAGE="受理流程未产生说明，请检查 workflow 日志。"; fi
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$MESSAGE"

      - name: Persist recipe and registry
        if: steps.parse.outputs.ok == 'true' && steps.parse.outputs.duplicate != 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(sites): register ${{ steps.parse.outputs.key }} from #${{ github.event.issue.number }} [skip ci]"
          git pull --rebase --autostash
          git push

  harvest:
    needs: intake
    if: needs.intake.outputs.ok == 'true' && needs.intake.outputs.duplicate != 'true'
    uses: ./.github/workflows/_collect.yml
    with:
      sites: ${{ needs.intake.outputs.key }}
      mode: full
      verify: true
      commit: true
      issue_number: ${{ github.event.issue.number }}
    secrets: inherit

  finalise:
    needs: [intake, harvest]
    if: always() && needs.intake.outputs.ok == 'true' && needs.intake.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Label the issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SITES_OK: ${{ needs.harvest.outputs.sites_ok }}
        run: |
          set -euo pipefail

          # Labels are repo state, so they can be absent -- in a fork, or in a repository that
          # never ran the one-time setup. Create them on demand rather than let a missing label
          # decide the outcome of an intake. `--force` makes this idempotent.
          ensure_label() {
            gh label create "$1" --repo "$REPO" --color "$2" --description "$3" --force >/dev/null 2>&1 || \
              echo "::warning::could not create label $1"
          }

          if [ "${SITES_OK:-0}" -gt 0 ]; then
            ensure_label collected 1d76db "已成功采集并加入订阅"
            # Labelling is cosmetic; closing the issue is the point. A failed `gh label create`
            # must not abort the script before the close, which is what `set -e` did before.
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label collected || \
              echo "::warning::could not add label 'collected'"
            gh issue close "$ISSUE_NUMBER" --repo "$REPO" --comment "采集成功，已加入订阅。"
          else
            ensure_label needs-manual fbca04 "自动采集失败，需人工补充配置"
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label needs-manual || \
              echo "::warning::could not add label 'needs-manual'"
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
              --body "自动采集未成功，已标记为 needs-manual。通常需要人工补充接口路径或选择器映射（见 sites/*.yaml），补齐后可在 Actions 页面手动触发 workflow_dispatch 重试。"
          fi
