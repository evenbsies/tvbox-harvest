[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tvbox-harvest"
version = "0.1.0"
description = "Auto-harvest video VOD sources from submitted sites and generate TVBox-compatible subscription JSON"
requires-python = ">=3.11"
# Kept in lockstep with requirements.txt, which is the file CI installs. See the header comment
# there: the two drifting apart is how a broken declared environment stayed invisible.
dependencies = [
    "httpx[http2]~=0.28.1",
    "selectolax~=1.0.0",
    "pydantic~=2.14.1",
    "pydantic-settings~=2.16.0",
    "PyYAML~=6.0.3",
    "ruamel.yaml~=0.19.1",
    "orjson~=3.13.0",
    "tenacity~=9.2.1",
    "structlog~=26.1.0",
    "typer~=0.27.3",
    "rich~=15.0.0",
    "playwright~=1.64.0",
    "python-dateutil~=2.9.0",
    "jsonschema~=4.26.0",
]

[project.optional-dependencies]
dev = ["pytest~=9.1.1", "pytest-asyncio~=1.4.0", "respx~=0.23.1"]

[project.scripts]
harvest = "harvest.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    # Report text and recipe comments are written to a natural width, not to a column.
    "E501",
    # B008 flags `x: str = typer.Option(...)`. That is not a mistake being tolerated -- it is the
    # only spelling Typer accepts for declaring a CLI default. Every flagged site in cli.py is
    # correct by construction, so the rule is simply inapplicable here.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Tests stub out methods with deliberately mismatched signatures and reuse fixture names.
"tests/**" = ["B011", "N802"]
