# Tier-1 recipe template (Apple CMS / MacCMS V10 standard interface).
#
# Copy this file to `sites/<key>.yaml`, set `base_url`, and run:
#     harvest probe --site <key>
# The `detect:` block below is written back automatically; everything above it is yours.
#
# IMPORTANT: only add sites you are permitted to harvest. See COMPLIANCE.md.

key: example-maccms
name: 示例苹果CMS站
base_url: https://example.com
adapter: maccms_v10
enabled: false

compliance:
  policy: block_adult      # allow | block_adult | quarantine
  bc_filter: true          # drop gambling advertising / operator-supplied sources
  notes: "Replace with your own assessment of this source's licensing status."

request:
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
    Referer: "{base_url}/"
    Accept-Language: "zh-CN,zh;q=0.9"
  rate_limit: 1.0          # requests per second; the global ceiling is 2.0
  timeout: 15
  retries: 3
  respect_robots: true
  delay_jitter: 0.3

auth:
  type: none               # none | token | md5_sign
  # For token/sign sites the value is read from an environment variable named here --
  # never put a credential in a recipe file, it would end up in git history.
  token_secret: null
  token_query_name: token

maccms:
  api_path: /api.php/provide/vod/   # keep the trailing slash if the site uses one
  categories_all: true
  page_limit: 20
  max_pages: 40
  incremental_hours: 24

tvbox:
  # Leave `api` unset to let the adapter derive it from base_url + maccms.api_path.
  # Anything set here overrides the adapter's decision.
  searchable: 1
  quickSearch: 1
  filterable: 1
  playerType: 2

detect: {}
