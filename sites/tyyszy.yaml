# Tier-1 recipe: 天涯影视资源 (tyyszyapi.com) 的公开苹果CMS V10 采集接口。
#
# 为什么要加这个源：原来只有 聚合影视接口 + 洛雪 + 追影 三个，内容面太窄。这是同一类公开
# 采集接口，分类表是常规的 电影/电视剧/综艺/动漫 + 类型细分（39 项），没有成人分类。
#
# 实测（2026-10-17）：
#   * total=72731，pagecount=3637，每页 20 条，`?ac=list` 与 `?ac=videolist` 都正常。
#   * 列表项自带 `vod_play_url`，即**不需要详情请求**就能拿到剧集地址——T1 的成本是每页一次。
#
# 启用条件（两处都要改，`_harvest_enabled` 要求一致）：本文件的 `enabled` 与
# sites/registry.yaml 里同 key 的 `enabled`。

key: tyyszy
name: 天涯影视
base_url: https://tyyszyapi.com
adapter: maccms_v10
enabled: true

compliance:
  policy: block_adult
  bc_filter: true
  notes: >-
    Public collection endpoint, same class as 聚合影视接口. Its catalogue is third-party
    aggregated content; enabled with the operator's knowledge. Disable by setting
    `enabled: false` here and in sites/registry.yaml, then re-running generate.

request:
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0
      Safari/537.36"
    Referer: "{base_url}/"
  rate_limit: 1.0
  timeout: 20
  retries: 3
  respect_robots: true
  delay_jitter: 0.3

maccms:
  api_path: /api.php/provide/vod/
  categories_all: true
  # 站点有 3637 页；先取前 100 页（约 2000 部），跑得完、也够撑起一个源的体量。
  max_pages: 100
  incremental_hours: 24
  page_limit: 20

budget:
  # 全局默认 300 是给未知站点留的安全值，对一个能稳定翻 100 页的 T1 源太小了：
  # 300 部 vs 7 万部的总目录，用户会觉得"这个源没东西"。
  max_titles_per_run: 2000
  max_requests_per_site: 400

tvbox:
  searchable: 1
  quickSearch: 1
  filterable: 1
  playerType: 2

detect:
  version: 1
  result: maccms_v10
  tier: 1
  status: ok
  stale: false
  evidence:
    notes:
      - 'Hand-written from a live probe on 2026-10-17: total=72731, pagecount=3637, 39 classes.'
browser: {}
selectors: {}
probe: {}
