# Tier-1 recipe: a public MacCMS V10 collection interface.
#
# This is the standardised `api.php/provide/vod/` endpoint that resource sites publish for others
# to consume. It arrived here as the pipeline's live smoke-test target and is now ENABLED, which
# makes it the first real entry in the published subscription.
#
# What enabling means, concretely: everything this site returns is harvested on the schedule in
# .github/workflows/collect.yml, filtered, and committed to `data/`, where jsDelivr serves it as
# a TVBox subscription. The repository is public, so the index is public. Read COMPLIANCE.md and
# satisfy yourself about the licensing position before enabling anything else.
#
# Note this endpoint is a good example of a real-world MacCMS quirk the pipeline has to handle:
# it returns perfectly valid JSON under `Content-Type: text/html;charset=utf-8`. Detection
# therefore trusts the response body and ignores the declared content type.

key: validation-lziapi
name: 采集接口验证站
base_url: https://cj.lziapi.com
adapter: maccms_v10
enabled: true

compliance:
  policy: block_adult
  bc_filter: true
  notes: >-
    Public collection endpoint. Its catalogue is third-party aggregated content; it is enabled
    here as the first published source, with the operator's knowledge. Disable it by setting
    `enabled: false` (and removing the registry entry) and re-running generate.

request:
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0
      Safari/537.36"
    Referer: "{base_url}/"
  rate_limit: 1.0
  timeout: 20
  retries: 3
  respect_robots: true
  delay_jitter: 0.3

maccms:
  # Verified by `harvest probe`: this endpoint answers ?ac=list with a full catalogue and a
  # 44-entry class table, and passes the ?ac=detail shape check.
  api_path: /api.php/provide/vod/
  categories_all: true
  max_pages: 20
  incremental_hours: 24

  page_limit: 20
tvbox:
  searchable: 1
  quickSearch: 1
  filterable: 1
  playerType: 2

detect:
  version: 1
  result: maccms_v10
  tier: 1
  status: ok
  stale: false
  evidence: {}
browser: {}
selectors: {}
probe: {}
